name: Crear APK de Futbol

on:
  workflow_dispatch:
  push:
    paths:
      - 'FutbolDesdeArriba_ProyectoAndroid.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar el juego
        run: |
          unzip -q FutbolDesdeArriba_ProyectoAndroid.zip -d source
          cd source
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Futbol-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
